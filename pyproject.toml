[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dubai-re-platform"
version = "0.1.0"
description = "Batch + real-time data engineering platform on Dubai Land Department open data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.31"]

[project.optional-dependencies]
local = ["duckdb>=1.0", "pyarrow>=15"]
aws = ["boto3>=1.34", "redshift_connector>=2.1", "pyarrow>=15"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
dre = "dre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
